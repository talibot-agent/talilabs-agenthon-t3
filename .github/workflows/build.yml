name: build-and-push
on: { push: { tags: ['v*'] }, workflow_dispatch: {} }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build baseline (organizers' pinned ABIDES)
        run: docker build --platform=linux/amd64 -t t3base:latest baselines/
      - name: build entry
        run: |
          TAG=${GITHUB_REF_NAME}; [ "$GITHUB_REF_TYPE" = tag ] || TAG=manual-${GITHUB_SHA::7}
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG
          docker build --platform=linux/amd64 -t $IMG .
          docker push $IMG
          docker inspect --format='{{index .RepoDigests 0}}' $IMG | tee digest.txt
      - uses: actions/upload-artifact@v4
        with: { name: digest, path: digest.txt }
